services:
  api:
    build: .
    environment:
      SALES_API_KEY: ${SALES_API_KEY:?Run scripts/bootstrap.py first}
      SALES_DATA_DIR: /data
      SALES_OLLAMA_URL: http://ollama:11434
      SALES_LLM_MODEL: ${SALES_LLM_MODEL:-qwen3:8b}
      SALES_EMBEDDING_MODEL: ${SALES_EMBEDDING_MODEL:-nomic-embed-text}
      SALES_USE_LLM: ${SALES_USE_LLM:-false}
      SALES_BIND: 0.0.0.0
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - sales_data:/data
    restart: unless-stopped
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.14}
    environment:
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.46.4}
    ports:
      - '127.0.0.1:5678:5678'
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run scripts/bootstrap.py first}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_SECURE_COOKIE: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_TEMPLATES_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: 'false'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '24'
      GENERIC_TIMEZONE: Asia/Tehran
      TZ: Asia/Tehran
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - '127.0.0.1:5173:80'
    depends_on:
      - api
    restart: unless-stopped
volumes:
  sales_data:
  ollama_data:
  n8n_data:
